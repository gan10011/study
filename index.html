<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>考试练题与模拟考试 H5</title>
  <link rel="stylesheet" href="style.css" />
  <!-- SheetJS（用于解析 Excel） -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="app-icon">📚</div>
        <h1>练题 & 模拟考试系统</h1>
      </div>
      <div class="controls">
        <input id="fileInput" type="file" accept=".xlsx,.xls" />
        <button id="clearBank">清空题库</button>
        <input id="searchInput" type="search" placeholder="搜索题库（题目/选项/解析）" style="padding:6px;margin-left:8px;max-width:220px" />
        <button id="clearSearch" style="display:inline-block;padding:6px">清空</button>
      </div>
    </header>

    <nav class="modes">
      <button id="mode-seq">顺序练习</button>
      <button id="mode-special">专项练习</button>
      <button id="mode-mock">模拟考试</button>
    </nav>

    <section class="top-card" id="answerCardWrap">
      <!-- 答题卡会渲染在这里 -->
    </section>

    <section class="config" id="modeConfig">
      <!-- 动态模式配置区域 -->
    </section>

    <main id="mainArea">
      <div id="questionArea" class="question-area">
        <!-- 问题展示区域 -->
        <div id="questionHeader" class="q-header"></div>
        <div id="questionBody" class="q-body"></div>
        <div id="questionFooter" class="q-footer"></div>
      </div>

      <aside class="side">
        <div class="meta">
          <div>题库总数：<span id="bankCount">0</span></div>
          <div>模式进度自动保存于本地</div>
        </div>
        <div class="exam-timer" id="examTimer" style="display:none;">
          剩余时间：<span id="timerDisplay">60:00</span>
        </div>
        <div class="actions">
          <button id="prevBtn">上一题</button>
          <button id="nextBtn">下一题</button>
          <button id="markBtn">标记/取消</button>
          <button id="submitMock" style="display:none;">交卷 / 结束考试</button>
        </div>
        <div class="notes">
          <small>注：题库导入后会保存在浏览器本地，清空会删除。</small>
        </div>
      </aside>
    </main>

    <footer>
      <div id="status">当前模式：<span id="currentMode">无</span></div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
